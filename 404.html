  .btn:hover{background:var(--cream);color:var(--ink);transform:translateY(-3px)}
  .alt{display:block;margin-top:22px;font-size:14px;color:rgba(255,247,238,.55)}
  .alt a{color:var(--accent);font-weight:700;text-decoration:none}
  footer{padding:26px 40px;border-top:1px solid var(--line-inv);font-size:13px;color:rgba(255,247,238,.45);text-align:center}
